<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <rect width="1600" height="1000" fill="#eef1f4"/>
  <rect x="60" y="50" width="1480" height="900" rx="24" fill="#ffffff" stroke="#d0d5dd"/>

  <text x="100" y="120" fill="#0e1116" font-family="Georgia, serif" font-size="36" font-weight="700">Payments Event Platform</text>
  <text x="100" y="165" fill="#5a6270" font-family="monospace" font-size="16">Transactional Outbox � Kafka � Idempotency � DLQ</text>

  <!-- Write path: one transaction -->
  <rect x="100" y="215" width="620" height="250" rx="16" fill="#f5f6f8" stroke="#0e1116" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="124" y="250" fill="#0e1116" font-family="monospace" font-size="15" font-weight="700">ONE DATABASE TRANSACTION</text>

  <rect x="124" y="272" width="270" height="80" rx="12" fill="#0e1116"/>
  <text x="148" y="305" fill="#c8f542" font-family="sans-serif" font-size="18" font-weight="700">payment</text>
  <text x="148" y="332" fill="#ffffff" font-family="monospace" font-size="13">status = RECEIVED</text>

  <rect x="424" y="272" width="270" height="80" rx="12" fill="#0e1116"/>
  <text x="448" y="305" fill="#c8f542" font-family="sans-serif" font-size="18" font-weight="700">outbox_event</text>
  <text x="448" y="332" fill="#ffffff" font-family="monospace" font-size="13">status = PENDING</text>

  <text x="124" y="400" fill="#0e1116" font-family="monospace" font-size="14">Both rows commit together  no dual-write gap</text>
  <text x="124" y="432" fill="#5a6270" font-family="monospace" font-size="14">POST /payments  �  Idempotency-Key required</text>

  <!-- Relay -->
  <path d="M720 340 L800 340" stroke="#0e1116" stroke-width="3"/>
  <path d="M792 332 L804 340 L792 348 Z" fill="#0e1116"/>

  <rect x="810" y="215" width="290" height="250" rx="16" fill="#c8f542"/>
  <text x="836" y="255" fill="#0e1116" font-family="sans-serif" font-size="20" font-weight="700">Relay</text>
  <text x="836" y="290" fill="#0e1116" font-family="monospace" font-size="13">FOR UPDATE SKIP LOCKED</text>
  <text x="836" y="318" fill="#0e1116" font-family="monospace" font-size="13">exponential backoff</text>
  <text x="836" y="346" fill="#0e1116" font-family="monospace" font-size="13">acks=all � idempotent</text>
  <text x="836" y="374" fill="#0e1116" font-family="monospace" font-size="13">scales horizontally</text>
  <text x="836" y="430" fill="#0e1116" font-family="monospace" font-size="13" font-weight="700">at-least-once</text>

  <path d="M1100 340 L1180 340" stroke="#0e1116" stroke-width="3"/>
  <path d="M1172 332 L1184 340 L1172 348 Z" fill="#0e1116"/>

  <!-- Kafka -->
  <rect x="1190" y="215" width="270" height="250" rx="16" fill="#0e1116"/>
  <text x="1214" y="255" fill="#c8f542" font-family="sans-serif" font-size="20" font-weight="700">Kafka</text>
  <text x="1214" y="292" fill="#ffffff" font-family="monospace" font-size="13">payments.events</text>
  <rect x="1214" y="308" width="220" height="26" rx="6" fill="#2a2f38"/>
  <rect x="1214" y="342" width="220" height="26" rx="6" fill="#2a2f38"/>
  <rect x="1214" y="376" width="220" height="26" rx="6" fill="#2a2f38"/>
  <text x="1214" y="432" fill="#8b93a1" font-family="monospace" font-size="12">keyed by payment id</text>

  <!-- Consumer row -->
  <rect x="100" y="500" width="620" height="180" rx="16" fill="#f5f6f8" stroke="#d0d5dd"/>
  <text x="124" y="540" fill="#0e1116" font-family="sans-serif" font-size="19" font-weight="700">Settlement consumer</text>
  <text x="124" y="576" fill="#0e1116" font-family="monospace" font-size="14">processed_event ledger � effectively-once</text>
  <text x="124" y="608" fill="#0e1116" font-family="monospace" font-size="14">retry �3 with backoff, then dead-letter</text>
  <text x="124" y="640" fill="#5a6270" font-family="monospace" font-size="14">payment � SETTLED</text>

  <rect x="760" y="500" width="340" height="180" rx="16" fill="#ffffff" stroke="#0e1116" stroke-width="2"/>
  <text x="784" y="540" fill="#0e1116" font-family="sans-serif" font-size="19" font-weight="700">Dead letter queue</text>
  <text x="784" y="576" fill="#5a6270" font-family="monospace" font-size="14">payments.events.dlq</text>
  <text x="784" y="608" fill="#5a6270" font-family="monospace" font-size="14">poison messages parked</text>
  <text x="784" y="640" fill="#5a6270" font-family="monospace" font-size="14">alert fires on counter</text>

  <rect x="1140" y="500" width="320" height="180" rx="16" fill="#0e1116"/>
  <text x="1164" y="540" fill="#c8f542" font-family="sans-serif" font-size="19" font-weight="700">Observability</text>
  <text x="1164" y="576" fill="#ffffff" font-family="monospace" font-size="14">outbox.backlog gauge</text>
  <text x="1164" y="608" fill="#ffffff" font-family="monospace" font-size="14">published / retried / parked</text>
  <text x="1164" y="640" fill="#8b93a1" font-family="monospace" font-size="14">Micrometer � Prometheus</text>

  <!-- Footer strip -->
  <rect x="100" y="716" width="1360" height="144" rx="16" fill="#f5f6f8" stroke="#d0d5dd"/>
  <text x="140" y="762" fill="#0e1116" font-family="monospace" font-size="17">Java 17 � Spring Boot 3.5 � PostgreSQL � Flyway � Apache Kafka</text>
  <text x="140" y="800" fill="#0e1116" font-family="monospace" font-size="17">Testcontainers integration tests � GitHub Actions CI � Docker Compose</text>
  <text x="140" y="838" fill="#5a6270" font-family="monospace" font-size="16">docker compose up � full stack running locally</text>
</svg>
